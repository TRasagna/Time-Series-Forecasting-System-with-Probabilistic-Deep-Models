version: '3.8'

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: probforecast-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # PostgreSQL for MLflow and monitoring
  postgres:
    image: postgres:15-alpine
    container_name: probforecast-postgres
    environment:
      POSTGRES_USER: probforecast
      POSTGRES_PASSWORD: probforecast123
      POSTGRES_DB: probforecast
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # MLflow Tracking Server
  mlflow:
    image: python:3.11-slim
    container_name: probforecast-mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://probforecast:probforecast123@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ./mlflow-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/app/mlflow-artifacts
    depends_on:
      - postgres
    restart: unless-stopped
    command: |
      bash -c "
      pip install mlflow psycopg2-binary &&
      mlflow server 
      --backend-store-uri postgresql://probforecast:probforecast123@postgres:5432/mlflow 
      --default-artifact-root ./mlflow-artifacts 
      --host 0.0.0.0 
      --port 5000
      "

  # FastAPI Service
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: probforecast-api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=probforecast
      - POSTGRES_PASSWORD=probforecast123
      - POSTGRES_DB=probforecast
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      - redis
      - postgres
      - mlflow
    restart: unless-stopped

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    container_name: probforecast-dashboard
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: probforecast-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: probforecast-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: probforecast-network
