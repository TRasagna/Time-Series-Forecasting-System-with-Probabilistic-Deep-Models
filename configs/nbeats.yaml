# N-BEATS Model Configuration
model:
  name: "nbeats"
  type: "residual_architecture"

architecture:
  generic_architecture: true
  num_stacks: 30
  num_blocks: 1
  num_layers: 4
  layer_widths: 256
  expansion_coefficient_dim: 5
  trend_polynomial_degree: 2
  dropout: 0.0
  activation: "ReLU"

interpretable:
  enabled: true
  trend_blocks: 3
  seasonality_blocks: 3

training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 500

optimizer:
  type: "adam"

hyperparameter_search:
  num_stacks: [10, 20, 30, 40]
  layer_widths: [128, 256, 512]
  learning_rate: [0.0001, 0.001, 0.01]
  num_blocks: [1, 2, 3]
